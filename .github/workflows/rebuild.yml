name: Rebuild calculator

on:
  workflow_dispatch:
  schedule:
    - cron: "20 12 * * *" # 20:20 HKT

permissions:
  contents: write

concurrency:
  group: rebuild-calculator
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: dssfgs/s1s2-formative-assessment
          path: _src
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _src/package-lock.json
      - run: npm ci
        working-directory: _src
      - run: npm run build
        working-directory: _src
      - name: Publish into /s1s2-formative-assessment
        run: |
          rm -rf s1s2-formative-assessment
          mkdir -p s1s2-formative-assessment
          cp -a _src/dist/. s1s2-formative-assessment/
          touch .nojekyll s1s2-formative-assessment/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll index.html s1s2-formative-assessment
          if git diff --staged --quiet; then
            echo "site already current"
          else
            git commit -m "rebuild calculator from s1s2-formative-assessment"
            git push
          fi
